name: Renewal Reminders

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 08:00 UTC; the API selects renewals exactly 5 days away
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run renewal reminder check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${ADMIN_API_KEY}" ]; then
            echo "SUPABASE_URL and ADMIN_API_KEY must be configured in the production environment."
            exit 1
          fi

          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "x-api-key: ${ADMIN_API_KEY}" \
            "${SUPABASE_URL}/functions/v1/api/admin/renewal-checks")"

          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Renewal reminder check failed with HTTP ${status_code}."
            exit 1
          fi