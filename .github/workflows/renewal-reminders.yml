name: Renewal Reminders

on:
  schedule:
    - cron: '0 8 * * *' # Every day at 08:00 UTC; the API selects renewals exactly 5 days away
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Optional email address for a sample renewal reminder (leave blank for a real scan)'
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run renewal reminder check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ] || [ -z "${ADMIN_API_KEY}" ]; then
            echo "SUPABASE_URL, SUPABASE_ANON_KEY, and ADMIN_API_KEY must be configured in the production environment."
            exit 1
          fi

          response_file="$(mktemp)"
          endpoint="${SUPABASE_URL}/functions/v1/api/admin/renewal-checks"
          if [ -n "${TEST_EMAIL}" ]; then
            endpoint="${endpoint}?test_email=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "${TEST_EMAIL}")"
          fi

          status_code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "x-api-key: ${ADMIN_API_KEY}" \
            "${endpoint}")"

          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Renewal reminder check failed with HTTP ${status_code}."
            exit 1
          fi

          if [ -n "${TEST_EMAIL}" ]; then
            if ! python3 - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          if payload.get("test") is not True or payload.get("success") is not True:
              print("The deployed function did not confirm a successful test email.")
              print("Deploy supabase/functions/api, then verify RESEND_API_KEY or SENDGRID_API_KEY and EMAIL_FROM in Supabase secrets.")
              raise SystemExit(1)
          PY
            then
              exit 1
            fi
          fi